# bulbsig notification rules.
#
# Shapes observed on macOS 27.0 (Notification Center DB, 2026-10-22):
#   Slack channel   title = workspace   subtitle = "#channel"   body = "Sender: text"
#   Slack DM        title = workspace   subtitle = "Sender"     body = "text"
#   Slack group DM  title = workspace   subtitle = "A, B"       body = "Sender: text"
#   Zen web push    title = page title  subtitle = "via site"   body = text
# Not yet seen for real: huddle invites, Google Calendar/Meet web pushes,
# Zoom/Teams, calendar apps. Those rules are best guesses.
#
# Try a notification:  bulbsig rules test --app com.tinyspeck.slackmacgap --subtitle "#eng" --body "Sam: @you hi"
#
# Format
#   [apps]   alias = ["bundle.id", "glob.*"]   (rules may use aliases or raw ids/globs)
#   [me]     handles = ["you"]   your @handles; "{me}" in any regex expands to them.
#            config.toml [me] handles overrides this list. Add "here", "channel" to count those.
#   [vip]    names = [...]   sender/title containing a name -> signal "vip" (checked first)
#   [[rule]] evaluated in order, first match wins:
#     name, apps, signal, key (str.format over notification fields + sender/channel), priority
#     title | subtitle | body | head (title+subtitle) | any (all) | sender | channel = "regex"
#       case-insensitive; all given must match
#     not_<field> = "regex"   rule is skipped if it matches
#     ignore = true           stop here with no signal
#     meeting = true          schedule a meeting countdown from the text instead of one signal
#   [focus]  allow = signal names / globs that still fire while focus mode is on

[apps]
slack = ["com.tinyspeck.slackmacgap"]
zen = ["app.zen-browser.zen"]
notion = ["notion.id"]
calendar = ["com.apple.iCal", "com.google.Calendar", "com.flexibits.fantastical*", "com.busymac.busycal*", "com.cron.electron"]
zoom = ["us.zoom.xos"]
teams = ["com.microsoft.teams", "com.microsoft.teams2"]
github = ["com.github.GitHubClient", "com.github.*"]
alerting = ["com.pagerduty.*", "com.opsgenie.*", "com.atlassian.opsgenie*"]

[me]
handles = []

[vip]
names = []   # whole-word, case-insensitive; config.toml [vip] names overrides
# apps = ["slack"]

[focus]
allow = ["ringing", "vip", "incident", "meeting_*", "heartbeat_lost"]

# --- noise -------------------------------------------------------------------
[[rule]]
name = "sentry"
apps = ["slack"]
body = '^Sentry:'
ignore = true

[[rule]]
name = "sentry-channel"
apps = ["slack"]
channel = 'sentry'
ignore = true

# --- calls: only when aimed at you (DM-shaped), not huddles happening in channels
[[rule]]
name = "call"
apps = ["slack"]
not_channel = '.'
any = 'huddle|is calling|calling you|incoming call|wants to (huddle|call)'
signal = "ringing"
key = "call:{sender}"

[[rule]]
name = "call-app"
apps = ["zoom", "teams"]
any = 'is calling|calling you|incoming call|invited you'
signal = "ringing"
key = "call:{title}"

# --- incidents ---------------------------------------------------------------
[[rule]]
name = "alerting-app"
apps = ["alerting"]
signal = "incident"
key = "incident:{title}"

[[rule]]
name = "incident-channel"
apps = ["slack"]
channel = '^#(incident|inc-|alerts?\b|outage|on-?call)'
signal = "incident"
key = "incident:{channel}"

# --- CI / GitHub (app or github.com web pushes; Slack channel CI bots stay quiet)
[[rule]]
name = "ci-failed"
apps = ["github", "zen"]
head = 'github|^via github\.com'
any = '\bfail(ed|ing|ure)\b'
signal = "incident"
key = "ci:{title}"

[[rule]]
name = "ci-success"
apps = ["github", "zen"]
head = 'github|^via github\.com'
any = '\b(passed|succeeded|successful|approved)\b'
signal = "success"
key = "ci:{title}"

# --- meetings (the calendar ICS feed is the main source; these catch app/web pushes)
[[rule]]
name = "meeting-now"
apps = ["calendar", "zoom", "teams"]
any = 'starting now|is starting|starts now|has started|\bnow\b'
signal = "meeting_t0"
key = "meeting:{title}"

[[rule]]
name = "meeting-soon-app"
apps = ["calendar", "zoom", "teams"]
signal = "meeting_t5"
key = "meeting:{title}"

# Google Calendar web pushes (Zen) arrive once, at the event's reminder time
# (10 min before by default). `meeting = true` makes the daemon read the start /
# end from the text and run the full countdown + ON AIR via the calendar watcher.
[[rule]]
name = "calendar-web"
apps = ["zen"]
subtitle = '^via calendar\.google\.com'
signal = "meeting_t10"
meeting = true
key = "meeting:{title}"

[[rule]]
name = "meeting-now-web"
apps = ["zen"]
subtitle = '^via (meet\.google\.com|[\w.]*zoom\.us|teams\.microsoft\.com|teams\.live\.com)'
any = 'starting now|is starting|starts now|has started|\bnow\b|joined|is waiting'
signal = "meeting_t0"
key = "meeting:{title}"

[[rule]]
name = "meeting-soon-web"
apps = ["zen"]
subtitle = '^via (meet\.google\.com|[\w.]*zoom\.us|teams\.microsoft\.com|teams\.live\.com)'
signal = "meeting_t5"
key = "meeting:{title}"

# --- Slack messages ------------------------------------------------------------
[[rule]]
name = "slack-mention"
apps = ["slack"]
channel = '.'
body = '@({me})\b'
signal = "mention"
key = "mention:{channel}"

[[rule]]
name = "slack-channel"
apps = ["slack"]
channel = '.'
ignore = true

[[rule]]
name = "slack-reminder"
apps = ["slack"]
sender = '^slackbot$'
body = '^reminder'
signal = "dm"
key = "reminder:{body}"

[[rule]]
name = "slack-dm"
apps = ["slack"]
not_channel = '.'
signal = "dm"
key = "dm:{subtitle}"

# --- Notion ---------------------------------------------------------------------
[[rule]]
name = "notion-mention"
apps = ["notion"]
any = 'mentioned you|@({me})\b'
signal = "mention"
key = "notion:{title}"
